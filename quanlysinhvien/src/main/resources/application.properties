spring.application.name=quanlysinhvien

# ====================================================================
# CAU HINH KET NOI SQL SERVER
# Hay sua lai cac thong so ben duoi cho dung voi may cua ban:
#   - localhost\\SQL2025  -->  doi thanh ten instance SQL Server cua ban
#     Vi du: localhost\\SQLEXPRESS  hoac  localhost (neu la default instance)
#   - databaseName       -->  ten database (mac dinh: quanlysinhvien)
#   - username / password -->  tai khoan SQL Server cua ban
# ====================================================================
spring.datasource.url=jdbc:sqlserver://localhost\\SQL2025;databaseName=quanlysinhvien;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# === JPA / Hibernate ===
# ddl-auto=none: Hibernate KHONG tu tao bang, ban phai chay file sql/init_students.sql truoc
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# === Server ===
server.port=8080
